name: Yank 3.7.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yank:
    runs-on: ubuntu-latest
    steps:
      - name: Yank 3.7.0 from PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          curl -X POST https://pypi.org/_/yank/ \
            -u "__token__:${PYPI_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{
              "project": "better-bing-image-downloader",
              "version": "3.7.0",
              "yanked_reason": "Broken on Python 3.9: HookOnProgress used PEP 604 union syntax (float | None) in a module-level expression, raising TypeError at import time. Use 3.7.1 or later."
            }'
